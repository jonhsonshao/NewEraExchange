<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Exchange DApp</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.8.2/dist/web3.min.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
        body{background:#0b1020;color:#fff;padding:20px;max-width:600px;margin:0 auto}
        .card{background:#141c33;border-radius:16px;padding:24px;margin-bottom:16px}
        h2{text-align:center;margin-bottom:20px;color:#42a5f5}
        .row{margin:14px 0}
        label{display:block;margin-bottom:6px;color:#b0c4de}
        input{width:100%;padding:12px;border-radius:8px;border:none;font-size:16px;background:#202b48;color:#fff}
        button{width:100%;padding:14px;border-radius:8px;border:none;font-size:16px;font-weight:bold;cursor:pointer;margin-top:8px}
        .btn-blue{background:#2196f3;color:#fff}
        .btn-green{background:#00c853;color:#fff}
        .btn-orange{background:#ff9100;color:#fff}
        .info{background:#1b2642;padding:12px;border-radius:8px;margin:8px 0;font-size:14px;color:#c8e1ff;word-break:break-all}
        .copy-box{display:flex;gap:8px}
        .copy-box input{flex:1}
        .copy-box button{width:auto;padding:0 14px}
        .tip{font-size:13px;color:#8997b7;margin-top:4px}
        .error-log{background:#381919;color:#ff9e9e}
    </style>
</head>
<body>
<div class="card">
    <h2>CS 兑换系统</h2>
    <div class="info">兑换合约：0xA7B8B21Ca3dF01b12B1de54BafF9C1e2F29f6375</div>
    <div class="row">
        <button class="btn-blue" id="connectBtn">连接TP钱包(BSC主网)</button>
        <div class="info" id="walletInfo">未连接钱包</div>
    </div>
</div>

<div class="card">
    <div class="row">
        <label>生成你的推荐链接</label>
        <div class="copy-box">
            <input id="refLink" readonly>
            <button id="copyLinkBtn">复制</button>
        </div>
        <p class="tip">他人打开链接自动带入你的推荐地址</p>
    </div>
    <div class="info" id="bindRefInfo">当前绑定推荐人：查询中...</div>
    <div class="info" id="refValidTip"></div>
</div>

<div class="card">
    <div class="row">
        <label>兑换USDT数量</label>
        <input type="number" step="0.01" min="0.01" id="usdtAmount" placeholder="输入USDT数量">
        <p class="tip">1 USDT = 1000 CS｜BSC-USDT = 6位小数</p>
    </div>
    <div class="row">
        <div class="info" id="estimateOutput">预计获得 CS：0</div>
    </div>
    <div class="info" id="allowanceTip">当前授权额度：未查询</div>
    <div class="info error-log" id="simulateLog">交易模拟日志：无</div>

    <button class="btn-orange" id="approveBtn">授权（额度=输入的USDT数量）</button>
    <button class="btn-green" id="exchangeBtn">执行兑换</button>
</div>

<div class="card">
    <h2>合约全局数据</h2>
    <div class="info" id="timeLeft">剩余时效：加载中</div>
    <div class="info" id="remainUserToken">可兑换CS剩余：加载中</div>
    <div class="info" id="remainLPToken">LP可用CS剩余：加载中</div>
    <div class="info" id="contractStatus">合约状态：加载中</div>
</div>

<script>
// ===================== 配置区 =====================
const RPC = "https://bsc-dataseed.binance.org/";
const CHAIN_ID = 56;
const EXCHANGE_CONTRACT = "0xA7B8B21Ca3dF01b12B1de54BafF9C1e2F29f6375";
const USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
const EXCHANGE_RATE = 1000;
const REF_MIN_USDT = 100;
const USDT_DECIMAL = 6;
// =================================================

let web3;
let exchangeContract;
let usdtContract;
let currentAccount = null;
let urlRefAddr = null;

/**
 * USDT金额转换：小数转链上uint（6位）
 */
function usdtToUint(amountStr){
    const num = parseFloat(amountStr);
    if(isNaN(num) || num <= 0) return "0";
    const unit = new web3.utils.BN("10").pow(new web3.utils.BN(USDT_DECIMAL));
    return new web3.utils.BN(num.toFixed(6)).mul(unit).toString();
}

/**
 * 模拟兑换交易，捕获回滚原因（核心：定位预估失败）
 */
async function simulateExchange(amountUint, refAddr){
    try{
        await exchangeContract.methods.exchangeNewEra(amountUint, refAddr).call({from:currentAccount});
        document.getElementById("simulateLog").innerText = "✅模拟成功，交易可正常执行";
        return true;
    }catch(err){
        document.getElementById("simulateLog").innerText = "❌模拟失败：" + err.message;
        console.error("模拟报错详情：", err);
        return false;
    }
}

// 读取URL推荐人
function parseUrlRef(){
    const search = new URLSearchParams(window.location.search);
    const ref = search.get("ref");
    if(ref && web3.utils.isAddress(ref)){
        urlRefAddr = ref;
        console.log("链接携带推荐地址：", ref);
    }
}

async function initWeb3(){
    if(window.ethereum){
        web3 = new Web3(window.ethereum);
    }else{
        web3 = new Web3(new Web3.providers.HttpProvider(RPC));
        alert("请使用TP钱包内置浏览器打开页面");
    }
    exchangeContract = new web3.eth.Contract(getExchangeABI(), EXCHANGE_CONTRACT);
    usdtContract = new web3.eth.Contract(getUsdtABI(), USDT_CONTRACT);
    parseUrlRef();
}

// 连接钱包
document.getElementById("connectBtn").addEventListener("click",async ()=>{
    try{
        const accounts = await window.ethereum.request({method:"eth_requestAccounts"});
        currentAccount = accounts[0];
        document.getElementById("walletInfo").innerText = "已连接："+currentAccount;
        updateRefLink();
        loadContractData();
        loadUserBindInfo();
        queryAllowance();
    }catch(e){
        alert("连接失败："+e.message);
    }
})

function updateRefLink(){
    const base = window.location.origin + window.location.pathname;
    const link = base + "?ref="+currentAccount;
    document.getElementById("refLink").value = link;
}

document.getElementById("copyLinkBtn").addEventListener("click",()=>{
    const input = document.getElementById("refLink");
    input.select();
    document.execCommand("copy");
    alert("推荐链接复制成功！");
})

// 输入框实时计算预期CS
document.getElementById("usdtAmount").oninput = function(){
    const val = Number(this.value)||0;
    document.getElementById("estimateOutput").innerText = "预计获得 CS："+(val * EXCHANGE_RATE).toFixed(2);
}

// 查询当前授权额度
async function queryAllowance(){
    if(!currentAccount) return;
    const res = await usdtContract.methods.allowance(currentAccount,EXCHANGE_CONTRACT).call();
    const realNum = Number(res)/1e6;
    document.getElementById("allowanceTip").innerText = "当前授权额度："+realNum.toFixed(2)+" USDT";
}

/**
 * 【重点修改】授权金额 = 用户输入数量，不再无限授权
 */
document.getElementById("approveBtn").addEventListener("click",async ()=>{
    if(!currentAccount) return alert("先连接钱包");
    const inputVal = document.getElementById("usdtAmount").value;
    const approveUint = usdtToUint(inputVal);
    if(approveUint === "0") return alert("请先填写有效的USDT兑换数量");

    try{
        await usdtContract.methods.approve(EXCHANGE_CONTRACT, approveUint).send({from:currentAccount});
        alert("授权交易已提交！");
        setTimeout(queryAllowance, 3000);
    }catch(e){
        alert("授权失败："+e.message);
    }
})

// 兑换按钮
document.getElementById("exchangeBtn").addEventListener("click",async ()=>{
    if(!currentAccount) return alert("先连接钱包");
    const inputVal = document.getElementById("usdtAmount").value;
    const amountUint = usdtToUint(inputVal);
    if(amountUint === "0") return alert("请填写USDT数量");

    // 优先读取链接推荐地址
    let refAddr = urlRefAddr || "0x0000000000000000000000000000000000000000";

    // 先模拟交易，提前暴露错误
    const canRun = await simulateExchange(amountUint, refAddr);
    if(!canRun){
        return alert("模拟执行失败，请查看页面【交易模拟日志】排查原因！");
    }

    try{
        await exchangeContract.methods.exchangeNewEra(amountUint, refAddr).send({from:currentAccount});
        alert("兑换交易提交成功！");
        loadContractData();
        loadUserBindInfo();
        queryAllowance();
    }catch(e){
        alert("兑换失败："+e.message);
    }
})

async function loadContractData(){
    try{
        const leftTime = await exchangeContract.methods.getLeftTime().call();
        const remainUser = await exchangeContract.methods.getRemainUserToken().call();
        const remainLP = await exchangeContract.methods.getRemainLpToken().call();
        const closed = await exchangeContract.methods.exchangeClosed().call();

        const day = Math.floor(leftTime/(86400));
        const hour = Math.floor((leftTime%86400)/3600);
        document.getElementById("timeLeft").innerText = `剩余时效：${day}天${hour}小时`;
        document.getElementById("remainUserToken").innerText = "可兑换CS剩余："+web3.utils.fromWei(remainUser,"ether");
        document.getElementById("remainLPToken").innerText = "LP池可用CS剩余："+web3.utils.fromWei(remainLP,"ether");
        document.getElementById("contractStatus").innerText = closed ? "合约状态：已关闭兑换" : "合约状态：正常开放";
    }catch(e){
        console.error(e);
    }
}

async function loadUserBindInfo(){
    if(!currentAccount) return;
    try{
        const bindRef = await exchangeContract.methods.getUserRef(currentAccount).call();
        document.getElementById("bindRefInfo").innerText = "当前绑定推荐人："+bindRef;

        if(bindRef !== "0x0000000000000000000000000000000000000000"){
            const refPay = await exchangeContract.methods.getUserTotalUSDT(bindRef).call();
            const refPayNum = Number(refPay)/1e6;
            if(refPayNum >= REF_MIN_USDT){
                document.getElementById("refValidTip").innerText = "✅推荐人满足100USDT门槛，奖励正常发放";
            }else{
                document.getElementById("refValidTip").innerText = "⚠️推荐人不足100USDT，推荐奖励划入保护钱包";
            }
        }else{
            document.getElementById("refValidTip").innerText = "暂无绑定推荐人，打开分享链接完成首次绑定";
        }
    }catch(e){
        console.error(e);
    }
}

// ABI分离
function getExchangeABI(){
    return [
        {"inputs":[{"internalType":"address","name":"_newEraToken","type":"address"},{"internalType":"address","name":"_protectWallet","type":"address"},{"internalType":"address","name":"_lendingWallet","type":"address"},{"internalType":"address","name":"_lpMasterWallet","type":"address"}],"stateMutability":"nonpayable","type":"constructor"},
        {"inputs":[],"name":"checkShouldClose","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},
        {"inputs":[],"name":"exchangeClosed","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},
        {"inputs":[{"internalType":"uint256","name":"payUSDTAmount","type":"uint256"},{"internalType":"address","name":"refAddr","type":"address"}],"name":"exchangeNewEra","outputs":[],"stateMutability":"nonpayable","type":"function"},
        {"inputs":[],"name":"expireSettle","outputs":[],"stateMutability":"nonpayable","type":"function"},
        {"inputs":[],"name":"getLeftTime","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
        {"inputs":[],"name":"getRemainUserToken","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
        {"inputs":[],"name":"getRemainLpToken","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
        {"inputs":[{"internalType":"address","name":"user","type":"address"}],"name":"getUserRef","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"},
        {"inputs":[{"internalType":"address","name":"user","type":"address"}],"name":"getUserTotalUSDT","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
        {"inputs":[],"name":"isExpire","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"}
    ];
}
function getUsdtABI(){
    return [
        {"constant":true,"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"balance","type":"uint256"}],"type":"function"},
        {"constant":false,"inputs":[{"name":"_spender","type":"address"},{"name":"_value","type":"uint256"}],"name":"approve","outputs":[{"name":"success","type":"bool"}],"type":"function"},
        {"constant":true,"inputs":[{"name":"_owner","type":"address"},{"name":"_spender","type":"address"}],"name":"allowance","outputs":[{"name":"remaining","type":"uint256"}],"type":"function"}
    ];
}

window.onload = async ()=>{
    await initWeb3();
}
</script>
</body>
</html>
