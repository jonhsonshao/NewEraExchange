<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1">
    <title>NewEra Exchange</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.8.2/dist/web3.min.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
        body{background:#0b1020;color:#fff;padding:20px;max-width:600px;margin:0 auto;position:relative}
        .wallet-corner{
            position:fixed;
            top:16px;
            right:16px;
            background:#2196f3;
            padding:8px 12px;
            border-radius:8px;
            font-size:13px;
            cursor:pointer;
            z-index:99;
        }
        .card{background:#141c33;border-radius:16px;padding:24px;margin-bottom:16px}
        h2{text-align:center;margin-bottom:20px;color:#42a5f5}
        .row{margin:14px 0}
        label{display:block;margin-bottom:6px;color:#b0c4de}
        input{width:100%;padding:12px;border-radius:8px;border:none;font-size:16px;background:#202b48;color:#fff}
        button{width:100%;padding:14px;border-radius:8px;border:none;font-size:16px;font-weight:bold;cursor:pointer;margin-top:8px}
        button:disabled{opacity:0.6;cursor:not-allowed;}
        .btn-green{background:#00c853;color:#fff}
        .info{background:#1b2642;padding:12px;border-radius:8px;margin:8px 0;font-size:14px;color:#c8e1ff;word-break:break-all}
        .copy-box{display:flex;gap:8px}
        .copy-box input{flex:1}
        .copy-box button{width:auto;padding:0 14px;margin-top:0}
        .tip{font-size:13px;color:#8997b7;margin-top:4px}
    </style>
</head>
<body>
    <div class="wallet-corner" id="cornerWalletBtn">连接钱包</div>

<div class="card">
    <h2>NewEra 兑换系统</h2>
    <div class="row">
        <label>生成你的推荐链接</label>
        <div class="copy-box">
            <input id="refLink" readonly>
            <button id="copyLinkBtn">复制</button>
        </div>
        <p class="tip">新用户打开链接，首次兑换交易自动绑定推荐关系</p>
    </div>
    <div class="info" id="bindRefInfo">当前绑定推荐人：加载中...</div>
    <div class="info" id="refValidTip"></div>
</div>

<div class="card">
    <div class="row">
        <label>兑换USDT数量</label>
        <input type="number" id="usdtAmount" placeholder="输入USDT数量" min="0" step="0.01">
        <p class="tip">1 USDT = 1000 NewEra</p>
    </div>
    <div class="row">
        <div class="info" id="estimateOutput">预计获得 NewEra：0</div>
    </div>
    <button class="btn-green" id="exchangeBtn">执行兑换</button>
</div>

<div class="card">
    <h2>合约数据</h2>
    <div class="info" id="timeLeft">剩余时效：加载中</div>
    <div class="info" id="remainUserToken">可兑换NewEra剩余：加载中</div>
    <div class="info" id="remainLPToken">LP池可用NewEra剩余：加载中</div>
    <div class="info" id="contractStatus">合约状态：加载中</div>
</div>

<script>
// ===================== 全局配置 =====================
const RPC = "https://bsc-dataseed.binance.org/";
const EXCHANGE_CONTRACT = "0xA7B8B21Ca3dF01b12B1de54BafF9C1e2F29f6375";
const USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
const EXCHANGE_RATE = 1000;
const REF_MIN_USDT = 100;
const ZERO_ADDR = "0x0000000000000000000000000000000000000000";
const BSC_CHAIN_ID = "0x38";

const ExchangeABI = [
    {"inputs":[{"internalType":"address","name":"_newEraToken","type":"address"},{"internalType":"address","name":"_protectWallet","type":"address"},{"internalType":"address","name":"_lendingWallet","type":"address"},{"internalType":"address","name":"_lpMasterWallet","type":"address"}],"stateMutability":"nonpayable","type":"constructor"},
    {"inputs":[],"name":"checkShouldClose","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},
    {"inputs":[],"name":"exchangeClosed","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"internalType":"uint256","name":"payUSDTAmount","type":"uint256"},{"internalType":"address","name":"refAddr","type":"address"}],"name":"exchangeNewEra","outputs":[],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[],"name":"expireSettle","outputs":[],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[],"name":"getLeftTime","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[],"name":"getRemainUserToken","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[],"name":"getRemainLpToken","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"internalType":"address","name":"user","type":"address"}],"name":"getUserRef","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"internalType":"address","name":"user","type":"address"}],"name":"getUserTotalUSDT","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"}
];

const UsdtABI = [
    {"constant":true,"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"balance","type":"uint256"}],"type":"function"},
    {"constant":false,"inputs":[{"name":"_spender","type":"address"},{"name":"_value","type":"uint256"}],"name":"approve","outputs":[{"name":"success","type":"bool"}],"type":"function"},
    {"constant":true,"inputs":[{"name":"_owner","type":"address"},{"name":"_spender","type":"address"}],"name":"allowance","outputs":[{"name":"remaining","type":"uint256"}],"type":"function"}
];
// =================================================

let web3;
let exchangeContract;
let usdtContract;
let currentAccount = null;
let cacheRefAddr = null;

//解析URL推荐人，URL参数 > localStorage
function parseUrlRef(){
    const search = new URLSearchParams(window.location.search);
    const urlRef = search.get("ref");
    if(urlRef && web3.utils.isAddress(urlRef)){
        cacheRefAddr = urlRef.toLowerCase();
        localStorage.setItem("cachedReferral", cacheRefAddr);
        console.log("✅ 链接携带推荐人：",cacheRefAddr);
        return;
    }
    const localRef = localStorage.getItem("cachedReferral");
    if(localRef && web3.utils.isAddress(localRef)){
        cacheRefAddr = localRef;
        console.log("📦 读取本地缓存推荐人：",cacheRefAddr);
    }else{
        cacheRefAddr = null;
        localStorage.removeItem("cachedReferral");
    }
}

//自推校验：自己不能作为自己的推荐人
function checkSelfReferral(){
    if(!currentAccount || !cacheRefAddr) return;
    if(currentAccount.toLowerCase() === cacheRefAddr.toLowerCase()){
        cacheRefAddr = null;
        localStorage.removeItem("cachedReferral");
        console.log("❌ 禁止自推荐，清除推荐缓存");
    }
}

//自动连接重试（解决TP读取延迟）
async function tryAutoConnect(){
    try{
        const accounts = await window.ethereum.request({method:"eth_accounts"});
        if(accounts.length > 0){
            currentAccount = accounts[0].toLowerCase();
            checkSelfReferral();
            refreshWalletUI();
            loadContractData();
            loadUserBindInfo();
        }else{
            console.log("ℹ️ 无已授权钱包，等待手动连接");
        }
    }catch(e){
        console.log("自动查询账户失败：",e.message);
    }
}

async function initWeb3(){
    if(!window.ethereum){
        alert("请使用TP钱包内置浏览器打开页面！");
        return false;
    }
    web3 = new Web3(window.ethereum);
    exchangeContract = new web3.eth.Contract(ExchangeABI, EXCHANGE_CONTRACT);
    usdtContract = new web3.eth.Contract(UsdtABI, USDT_CONTRACT);
    parseUrlRef();

    //延迟500ms重试，适配TP钱包provider加载慢的问题
    setTimeout(async ()=>{
        await tryAutoConnect();
    },500);

    //监听账户切换
    window.ethereum.on("accountsChanged", async (accounts)=>{
        if(accounts.length === 0){
            currentAccount = null;
        }else{
            currentAccount = accounts[0].toLowerCase();
            checkSelfReferral();
        }
        refreshWalletUI();
        loadUserBindInfo();
    })
    return true;
}

//手动唤起钱包连接弹窗
async function connectWallet(){
    try{
        const accounts = await window.ethereum.request({method:"eth_requestAccounts"});
        currentAccount = accounts[0].toLowerCase();
        checkSelfReferral();
        //校验链是否BSC
        const chainId = await window.ethereum.request({method:"eth_chainId"});
        if(chainId !== BSC_CHAIN_ID){
            alert("请切换钱包网络为 BSC(BNB智能链)！");
        }
        refreshWalletUI();
        loadContractData();
        loadUserBindInfo();
    }catch(e){
        alert("钱包连接失败："+e.message);
    }
}

function refreshWalletUI(){
    const cornerBtn = document.getElementById("cornerWalletBtn");
    if(currentAccount){
        cornerBtn.innerText = currentAccount.slice(0,6)+"..."+currentAccount.slice(-4);
        updateRefLink();
    }else{
        cornerBtn.innerText = "连接钱包";
    }
}

function updateRefLink(){
    const base = window.location.origin + window.location.pathname;
    const link = base + "?ref="+currentAccount;
    document.getElementById("refLink").value = link;
}

document.getElementById("copyLinkBtn").addEventListener("click",()=>{
    const input = document.getElementById("refLink");
    input.select();
    document.execCommand("copy");
    alert("推荐链接复制成功");
})

document.getElementById("cornerWalletBtn").addEventListener("click",connectWallet);

document.getElementById("usdtAmount").oninput = function(){
    const val = Number(this.value)||0;
    document.getElementById("estimateOutput").innerText = "预计获得 NewEra："+(val * EXCHANGE_RATE).toFixed(2);
}

//兑换主逻辑
document.getElementById("exchangeBtn").addEventListener("click",async ()=>{
    if(!currentAccount){
        await connectWallet();
        if(!currentAccount) return;
    }

    const inputVal = document.getElementById("usdtAmount").value;
    const amountNum = parseFloat(inputVal);
    if(!amountNum || amountNum <= 0){
        return alert("请填写兑换USDT数量");
    }
    const targetWei = BigInt(web3.utils.toWei(inputVal,"ether"));
    const btn = document.getElementById("exchangeBtn");
    btn.disabled = true;

    try{
        let allowanceWei = BigInt(await usdtContract.methods.allowance(currentAccount, EXCHANGE_CONTRACT).call());
        if(allowanceWei < targetWei){
            const diff = targetWei - allowanceWei;
            await usdtContract.methods.approve(EXCHANGE_CONTRACT, diff.toString()).send({from:currentAccount});
        }

        //优先使用链上已绑定推荐人
        let bindOnChain = (await exchangeContract.methods.getUserRef(currentAccount).call()).toLowerCase();
        let finalRef;
        if(bindOnChain !== ZERO_ADDR){
            finalRef = bindOnChain;
        }else{
            finalRef = cacheRefAddr ? cacheRefAddr : ZERO_ADDR;
        }

        await exchangeContract.methods.exchangeNewEra(targetWei.toString(), finalRef).send({from:currentAccount});
        alert("🎉 兑换成功！");
        loadContractData();
        loadUserBindInfo();
    }catch(err){
        console.error(err);
        alert("操作失败："+err.message);
    }finally{
        btn.disabled = false;
    }
})

async function loadContractData(){
    try{
        const leftTime = await exchangeContract.methods.getLeftTime().call();
        const remainUser = await exchangeContract.methods.getRemainUserToken().call();
        const remainLP = await exchangeContract.methods.getRemainLpToken().call();
        const closed = await exchangeContract.methods.exchangeClosed().call();

        const day = Math.floor(leftTime/86400);
        const hour = Math.floor((leftTime%86400)/3600);
        document.getElementById("timeLeft").innerText = `剩余时效：${day}天${hour}小时`;
        document.getElementById("remainUserToken").innerText = "可兑换NewEra剩余："+Number(web3.utils.fromWei(remainUser,"ether")).toFixed(2);
        document.getElementById("remainLPToken").innerText = "LP池可用NewEra剩余："+Number(web3.utils.fromWei(remainLP,"ether")).toFixed(2);
        document.getElementById("contractStatus").innerText = closed ? "合约状态：已关闭兑换" : "合约状态：正常开放";
    }catch(e){
        console.log("合约数据读取异常");
    }
}

async function loadUserBindInfo(){
    if(!currentAccount) return;
    try{
        const bindRef = (await exchangeContract.methods.getUserRef(currentAccount).call()).toLowerCase();
        const infoDom = document.getElementById("bindRefInfo");
        const tipDom = document.getElementById("refValidTip");

        if(bindRef !== ZERO_ADDR){
            infoDom.innerText = "当前绑定推荐人："+bindRef;
            const refPayWei = await exchangeContract.methods.getUserTotalUSDT(bindRef).call();
            const refPayNum = Number(web3.utils.fromWei(refPayWei,"ether"));
            if(refPayNum >= REF_MIN_USDT){
                tipDom.innerText = "✅ 推荐人满足≥100USDT，奖励正常发放";
            }else{
                tipDom.innerText = "⚠️ 推荐人未达到100USDT门槛，推荐奖励划入保护钱包";
            }
        }else{
            if(cacheRefAddr){
                infoDom.innerText = "链上暂无绑定 | 已缓存推荐人："+cacheRefAddr;
                tipDom.innerText = "执行兑换时自动完成推荐绑定";
            }else{
                infoDom.innerText = "当前绑定推荐人：无";
                tipDom.innerText = "";
            }
        }
    }catch(e){}
}

window.onload = async ()=>{
    await initWeb3();
}
</script>
</body>
</html>
